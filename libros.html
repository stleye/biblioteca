<title>Libros leídos</title>
<style>
  :root {
    --paper: #f2ede2;
    --paper-raised: #e9e1d0;
    --ink: #2b2419;
    --ink-soft: #5b5240;
    --rule: #c7bca4;
    --rule-soft: #d9d0bc;
    --accent: #8a2f2f;
    --accent-soft: #c98f6a1a;
    --accent2: #4f6b52;
    --gold: #9c7522;
    --shadow: 0 1px 0 rgba(43,36,25,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1712;
      --paper-raised: #251f18;
      --ink: #e9e1d0;
      --ink-soft: #b3a890;
      --rule: #4a4030;
      --rule-soft: #362f24;
      --accent: #d1746f;
      --accent-soft: #d1746f22;
      --accent2: #8fae8b;
      --gold: #cda54a;
      --shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1c1712;
    --paper-raised: #251f18;
    --ink: #e9e1d0;
    --ink-soft: #b3a890;
    --rule: #4a4030;
    --rule-soft: #362f24;
    --accent: #d1746f;
    --accent-soft: #d1746f22;
    --accent2: #8fae8b;
    --gold: #cda54a;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    margin: 0;
    padding: 3rem 1.5rem 5rem;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2.75rem;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.15;
    margin: 0 0 0.75rem;
    text-wrap: balance;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 1.02rem;
    line-height: 1.6;
    max-width: 62ch;
    margin: 0;
  }

  .list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--rule);
  }

  .book {
    display: flex;
    align-items: flex-start;
    gap: 1.2rem;
    padding: 1.4rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .cover {
    flex: none;
    width: 56px;
    height: 78px;
    border-radius: 2px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover .placeholder {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
  }

  .title {
    font-size: 1.08rem;
    line-height: 1.3;
  }

  .author {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .synopsis {
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--ink);
    max-width: 56ch;
    margin: 0;
  }

  .characters {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .characters .label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-right: 0.4em;
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Vocabulario · Registro</p>
    <h1>Libros leídos</h1>
    <p class="sub">
      Los libros de los que voy sacando palabras nuevas para el vocabulario.
    </p>
  </header>

  <div class="list" id="list"></div>

  <footer>
    Para agregar un libro, sumá una entrada al arreglo <code>libros</code> en el código de esta página.
    El campo <code>portada</code> es opcional: dejalo vacío hasta tener la URL de la imagen.
  </footer>
</div>

<script>
  // Cada libro nuevo se agrega acá: { titulo, autor, sinopsis, personajes: [...], portada (URL, opcional) }
  const libros = [
    {
      titulo: "La caída de la Casa Usher",
      autor: "Edgar Allan Poe",
      sinopsis: "Un hombre visita a su amigo de la infancia, Roderick Usher, en su decadente mansión familiar. Roderick vive atormentado por una enfermedad nerviosa y por el estado de su hermana gemela, Madeline, gravemente enferma. A medida que la casa se desmorona, también lo hace la cordura de sus habitantes, hasta un final catastrófico.",
      personajes: ["El narrador (sin nombre)", "Roderick Usher", "Madeline Usher"],
      portada: ""
    },
    {
      titulo: "Veinte mil leguas de viaje submarino",
      autor: "Julio Verne",
      sinopsis: "El profesor Pierre Aronnax se embarca en la caza de un supuesto monstruo marino y termina prisionero a bordo del Nautilus, el submarino del enigmático capitán Nemo. Junto a él recorre los océanos del mundo, descubriendo maravillas y peligros de las profundidades.",
      personajes: ["Capitán Nemo", "Pierre Aronnax", "Conseil", "Ned Land"],
      portada: ""
    },
    {
      titulo: "La isla misteriosa",
      autor: "Julio Verne",
      sinopsis: "Cinco prisioneros escapan en globo durante la Guerra Civil estadounidense y quedan varados en una isla desierta del Pacífico. Con ingenio y trabajo colectivo logran sobrevivir y prosperar, ayudados en secreto por una misteriosa presencia que resulta ser el capitán Nemo.",
      personajes: ["Cyrus Smith", "Gedeón Spilett", "Pencroff", "Harbert", "Nab", "Capitán Nemo"],
      portada: ""
    },
    {
      titulo: "Viaje al centro de la Tierra",
      autor: "Julio Verne",
      sinopsis: "El profesor Otto Lidenbrock descifra un mensaje cifrado que revela una ruta hacia el centro de la Tierra a través de un volcán en Islandia. Junto a su sobrino Axel y el guía Hans, emprende un descenso lleno de peligros, criaturas prehistóricas y paisajes subterráneos.",
      personajes: ["Otto Lidenbrock", "Axel", "Hans Bjelke"],
      portada: ""
    },
    {
      titulo: "Estudio en escarlata",
      autor: "Arthur Conan Doyle",
      sinopsis: "La primera novela de Sherlock Holmes: el doctor Watson lo conoce y se instalan juntos en Baker Street. Juntos investigan un extraño asesinato en Londres cuyo origen se remonta a una historia de venganza entre los mormones de Utah.",
      personajes: ["Sherlock Holmes", "John Watson", "Inspector Lestrade", "Jefferson Hope"],
      portada: ""
    },
    {
      titulo: "El sabueso de los Baskerville",
      autor: "Arthur Conan Doyle",
      sinopsis: "Holmes y Watson investigan la maldición que pesa sobre la familia Baskerville, ligada a la leyenda de un perro espectral que ronda los páramos de Devon, tras la muerte sospechosa de Sir Charles Baskerville.",
      personajes: ["Sherlock Holmes", "John Watson", "Sir Henry Baskerville", "Dr. Mortimer"],
      portada: ""
    },
    {
      titulo: "Las aventuras de Sherlock Holmes",
      autor: "Arthur Conan Doyle",
      sinopsis: "Colección de doce relatos cortos protagonizados por el detective, que resuelve casos de robos, chantajes y misterios variados en el Londres victoriano, siempre acompañado por su fiel amigo Watson.",
      personajes: ["Sherlock Holmes", "John Watson"],
      portada: ""
    },
    {
      titulo: "El señor de las moscas",
      autor: "William Golding",
      sinopsis: "Un grupo de niños británicos queda varado en una isla desierta tras un accidente aéreo. Sin adultos que los guíen, intentan organizarse, pero el orden colectivo se derrumba y afloran el miedo, la violencia y el instinto salvaje.",
      personajes: ["Ralph", "Jack", "Piggy", "Simon"],
      portada: ""
    },
    {
      titulo: "La máquina del tiempo",
      autor: "H. G. Wells",
      sinopsis: "Un inventor victoriano construye una máquina capaz de viajar en el tiempo y llega al año 802.701, donde encuentra a la humanidad dividida en dos especies: los eloi, pacíficos y despreocupados, y los morlocks, que viven bajo tierra y los cazan.",
      personajes: ["El Viajero del Tiempo (sin nombre)", "Weena"],
      portada: ""
    }
  ];

  const list = document.getElementById("list");

  libros.forEach((libro) => {
    const row = document.createElement("div");
    row.className = "book";

    const cover = document.createElement("div");
    cover.className = "cover";
    if (libro.portada) {
      const img = document.createElement("img");
      img.src = libro.portada;
      img.alt = `Portada de ${libro.titulo}`;
      cover.appendChild(img);
    } else {
      const placeholder = document.createElement("span");
      placeholder.className = "placeholder";
      placeholder.textContent = "—";
      cover.appendChild(placeholder);
    }

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `
      <span class="title">${libro.titulo}</span>
      <span class="author">${libro.autor}</span>
      <p class="synopsis">${libro.sinopsis}</p>
      <p class="characters"><span class="label">Personajes</span>${libro.personajes.join(", ")}</p>
    `;

    row.appendChild(cover);
    row.appendChild(info);
    list.appendChild(row);
  });
</script>
