<title>Libros leídos</title>
<style>
  :root {
    --paper: #f2ede2;
    --paper-raised: #e9e1d0;
    --ink: #2b2419;
    --ink-soft: #5b5240;
    --rule: #c7bca4;
    --rule-soft: #d9d0bc;
    --accent: #8a2f2f;
    --accent-soft: #c98f6a1a;
    --accent2: #4f6b52;
    --gold: #9c7522;
    --shadow: 0 1px 0 rgba(43,36,25,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1712;
      --paper-raised: #251f18;
      --ink: #e9e1d0;
      --ink-soft: #b3a890;
      --rule: #4a4030;
      --rule-soft: #362f24;
      --accent: #d1746f;
      --accent-soft: #d1746f22;
      --accent2: #8fae8b;
      --gold: #cda54a;
      --shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1c1712;
    --paper-raised: #251f18;
    --ink: #e9e1d0;
    --ink-soft: #b3a890;
    --rule: #4a4030;
    --rule-soft: #362f24;
    --accent: #d1746f;
    --accent-soft: #d1746f22;
    --accent2: #8fae8b;
    --gold: #cda54a;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    margin: 0;
    padding: 3rem 1.5rem 5rem;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 3rem;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.15;
    margin: 0 0 0.75rem;
    text-wrap: balance;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 1.02rem;
    line-height: 1.6;
    max-width: 62ch;
    margin: 0;
  }

  .shelf {
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  .author-group {
    display: flex;
    flex-direction: column;
  }

  .author-head {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    border-top: 1px solid var(--rule);
    padding-top: 0.9rem;
    margin-bottom: 1.1rem;
  }

  .author-name {
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: -0.005em;
  }

  .author-count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .books {
    display: flex;
    flex-direction: column;
  }

  .book {
    display: flex;
    align-items: flex-start;
    gap: 1.2rem;
    padding: 1.2rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .book:last-child {
    border-bottom: none;
  }

  .cover {
    flex: none;
    width: 52px;
    height: 72px;
    border-radius: 2px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover .placeholder {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
  }

  .cover.has-image {
    cursor: zoom-in;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    z-index: 100;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: min(80vw, 480px);
    max-height: 85vh;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .lightbox-caption {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    text-align: center;
    color: #f2ede2;
    font-size: 0.85rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .lightbox-close {
    position: absolute;
    top: 1.5rem;
    right: 1.75rem;
    color: #f2ede2;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0.4rem;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
  }

  .title {
    font-size: 1.05rem;
    line-height: 1.3;
  }

  .synopsis {
    font-size: 0.87rem;
    line-height: 1.55;
    color: var(--ink);
    max-width: 56ch;
    margin: 0;
  }

  .characters {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .characters .label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-right: 0.4em;
  }

  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule-soft);
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }
</style>

</div>

</div>

      sinopsis: "Un médico practica una operación cerebral sobre una joven para permitirle ver el mundo que hay detrás del velo de lo visible. Años después, una serie de muertes inexplicables en la alta sociedad londinense empuja a dos hombres a reconstruir, pieza por pieza, el origen de la mujer que aparece en todas ellas. Relato fundacional del terror moderno, donde el horror nunca se muestra del todo: se deduce.",
      personajes: ["Doctor Raymond", "Clarke", "Villiers", "Mary", "Helen Vaughan"],
      portada: "https://covers.openlibrary.org/b/id/921610-L.jpg"
    }
  ];

  const shelf = document.getElementById("shelf");

  const porAutor = new Map();
  libros.forEach((libro) => {
    if (!porAutor.has(libro.autor)) porAutor.set(libro.autor, []);
    porAutor.get(libro.autor).push(libro);
  });

  const autoresOrdenados = [...porAutor.keys()].sort((a, b) => a.localeCompare(b, "es"));

  autoresOrdenados.forEach((autor) => {
    const obras = porAutor.get(autor);

    const group = document.createElement("div");
    group.className = "author-group";

    const head = document.createElement("div");
    head.className = "author-head";
    head.innerHTML = `
      <span class="author-name">${autor}</span>
      <span class="author-count">${obras.length} ${obras.length === 1 ? "libro" : "libros"}</span>
    `;
    group.appendChild(head);

    const books = document.createElement("div");
    books.className = "books";

    obras.forEach((libro) => {
      const row = document.createElement("div");
      row.className = "book";

      const cover = document.createElement("div");
      cover.className = "cover";
      if (libro.portada) {
        cover.classList.add("has-image");
        const img = document.createElement("img");
        img.src = libro.portada;
        img.alt = `Portada de ${libro.titulo}`;
        cover.appendChild(img);
        cover.addEventListener("click", () => openLightbox(libro.portada, `${libro.titulo} — ${libro.autor}`));
      } else {
        const placeholder = document.createElement("span");
        placeholder.className = "placeholder";
        placeholder.textContent = "—";
        cover.appendChild(placeholder);
      }

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `
        <span class="title">${libro.titulo}</span>
        <p class="synopsis">${libro.sinopsis}</p>
        <p class="characters"><span class="label">Personajes</span>${libro.personajes.join(", ")}</p>
      `;

      row.appendChild(cover);
      row.appendChild(info);
      books.appendChild(row);
    });

    group.appendChild(books);
    shelf.appendChild(group);
  });

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxCaption = document.getElementById("lightboxCaption");

  function openLightbox(src, caption) {
    lightboxImg.src = src;
    lightboxImg.alt = caption;
    lightboxCaption.textContent = caption;
    lightbox.classList.add("open");
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
  }

  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });
</script>
