<title>Libros leídos</title>
<style>
  :root {
    --paper: #f2ede2;
    --paper-raised: #e9e1d0;
    --ink: #2b2419;
    --ink-soft: #5b5240;
    --rule: #c7bca4;
    --rule-soft: #d9d0bc;
    --accent: #8a2f2f;
    --accent-soft: #c98f6a1a;
    --accent2: #4f6b52;
    --gold: #9c7522;
    --shadow: 0 1px 0 rgba(43,36,25,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1712;
      --paper-raised: #251f18;
      --ink: #e9e1d0;
      --ink-soft: #b3a890;
      --rule: #4a4030;
      --rule-soft: #362f24;
      --accent: #d1746f;
      --accent-soft: #d1746f22;
      --accent2: #8fae8b;
      --gold: #cda54a;
      --shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  }

  :root[data-theme="dark"] {
    --paper: #1c1712;
    --paper-raised: #251f18;
    --ink: #e9e1d0;
    --ink-soft: #b3a890;
    --rule: #4a4030;
    --rule-soft: #362f24;
    --accent: #d1746f;
    --accent-soft: #d1746f22;
    --accent2: #8fae8b;
    --gold: #cda54a;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    margin: 0;
    padding: 3rem 1.5rem 5rem;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 3rem;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.15;
    margin: 0 0 0.75rem;
    text-wrap: balance;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 1.02rem;
    line-height: 1.6;
    max-width: 62ch;
    margin: 0;
  }

  .shelf {
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  .author-group {
    display: flex;
    flex-direction: column;
  }

  .author-head {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    border-top: 1px solid var(--rule);
    padding-top: 0.9rem;
    margin-bottom: 1.1rem;
  }

  .author-name {
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: -0.005em;
  }

  .author-count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .books {
    display: flex;
    flex-direction: column;
  }

  .book {
    display: flex;
    align-items: flex-start;
    gap: 1.2rem;
    padding: 1.2rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .book:last-child {
    border-bottom: none;
  }

  .cover {
    flex: none;
    width: 52px;
    height: 72px;
    border-radius: 2px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover .placeholder {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
  }

  .title {
    font-size: 1.05rem;
    line-height: 1.3;
  }

  .synopsis {
    font-size: 0.87rem;
    line-height: 1.55;
    color: var(--ink);
    max-width: 56ch;
    margin: 0;
  }

  .characters {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .characters .label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-right: 0.4em;
  }

  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule-soft);
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Vocabulario · Registro</p>
    <h1>Libros leídos</h1>
    <p class="sub">
      Los libros de los que voy sacando palabras nuevas para el vocabulario, agrupados por autor.
    </p>
  </header>

  <div class="shelf" id="shelf"></div>

  <footer>
    Para agregar un libro, sumá una entrada al arreglo <code>libros</code> en el código de esta página.
    El campo <code>portada</code> es opcional: dejalo vacío hasta tener la URL de la imagen.
  </footer>
</div>

<script>
  // Cada libro nuevo se agrega acá: { titulo, autor, sinopsis, personajes: [...], portada (URL, opcional) }
  const libros = [
    {
      titulo: "La caída de la Casa Usher",
      autor: "Edgar Allan Poe",
      sinopsis: "Un hombre visita a su amigo de la infancia, Roderick Usher, en su decadente mansión familiar. Roderick vive atormentado por una enfermedad nerviosa y por el estado de su hermana gemela, Madeline, gravemente enferma. A medida que la casa se desmorona, también lo hace la cordura de sus habitantes, hasta un final catastrófico.",
      personajes: ["El narrador (sin nombre)", "Roderick Usher", "Madeline Usher"],
      portada: ""
    },
    {
      titulo: "Veinte mil leguas de viaje submarino",
      autor: "Julio Verne",
      sinopsis: "El profesor Pierre Aronnax se embarca en la caza de un supuesto monstruo marino y termina prisionero a bordo del Nautilus, el submarino del enigmático capitán Nemo. Junto a él recorre los océanos del mundo, descubriendo maravillas y peligros de las profundidades.",
      personajes: ["Capitán Nemo", "Pierre Aronnax", "Conseil", "Ned Land"],
      portada: ""
    },
    {
      titulo: "La isla misteriosa",
      autor: "Julio Verne",
      sinopsis: "Cinco prisioneros escapan en globo durante la Guerra Civil estadounidense y quedan varados en una isla desierta del Pacífico. Con ingenio y trabajo colectivo logran sobrevivir y prosperar, ayudados en secreto por una misteriosa presencia que resulta ser el capitán Nemo.",
      personajes: ["Cyrus Smith", "Gedeón Spilett", "Pencroff", "Harbert", "Nab", "Capitán Nemo"],
      portada: ""
    },
    {
      titulo: "Viaje al centro de la Tierra",
      autor: "Julio Verne",
      sinopsis: "El profesor Otto Lidenbrock descifra un mensaje cifrado que revela una ruta hacia el centro de la Tierra a través de un volcán en Islandia. Junto a su sobrino Axel y el guía Hans, emprende un descenso lleno de peligros, criaturas prehistóricas y paisajes subterráneos.",
      personajes: ["Otto Lidenbrock", "Axel", "Hans Bjelke"],
      portada: ""
    },
    {
      titulo: "Estudio en escarlata",
      autor: "Arthur Conan Doyle",
      sinopsis: "La primera novela de Sherlock Holmes: el doctor Watson lo conoce y se instalan juntos en Baker Street. Juntos investigan un extraño asesinato en Londres cuyo origen se remonta a una historia de venganza entre los mormones de Utah.",
      personajes: ["Sherlock Holmes", "John Watson", "Inspector Lestrade", "Jefferson Hope"],
      portada: ""
    },
    {
      titulo: "El sabueso de los Baskerville",
      autor: "Arthur Conan Doyle",
      sinopsis: "Holmes y Watson investigan la maldición que pesa sobre la familia Baskerville, ligada a la leyenda de un perro espectral que ronda los páramos de Devon, tras la muerte sospechosa de Sir Charles Baskerville.",
      personajes: ["Sherlock Holmes", "John Watson", "Sir Henry Baskerville", "Dr. Mortimer"],
      portada: ""
    },
    {
      titulo: "Las aventuras de Sherlock Holmes",
      autor: "Arthur Conan Doyle",
      sinopsis: "Colección de doce relatos cortos protagonizados por el detective, que resuelve casos de robos, chantajes y misterios variados en el Londres victoriano, siempre acompañado por su fiel amigo Watson.",
      personajes: ["Sherlock Holmes", "John Watson"],
      portada: ""
    },
    {
      titulo: "El señor de las moscas",
      autor: "William Golding",
      sinopsis: "Un grupo de niños británicos queda varado en una isla desierta tras un accidente aéreo. Sin adultos que los guíen, intentan organizarse, pero el orden colectivo se derrumba y afloran el miedo, la violencia y el instinto salvaje.",
      personajes: ["Ralph", "Jack", "Piggy", "Simon"],
      portada: ""
    },
    {
      titulo: "La máquina del tiempo",
      autor: "H. G. Wells",
      sinopsis: "Un inventor victoriano construye una máquina capaz de viajar en el tiempo y llega al año 802.701, donde encuentra a la humanidad dividida en dos especies: los eloi, pacíficos y despreocupados, y los morlocks, que viven bajo tierra y los cazan.",
      personajes: ["El Viajero del Tiempo (sin nombre)", "Weena"],
      portada: ""
    },
    {
      titulo: "Diez negritos",
      autor: "Agatha Christie",
      sinopsis: "Diez desconocidos son invitados a una isla aislada bajo distintos pretextos. Uno a uno van muriendo, siguiendo al pie de la letra los versos de una vieja canción infantil, mientras los sobrevivientes descubren que el asesino está entre ellos.",
      personajes: ["Vera Claythorne", "Philip Lombard", "Juez Wargrave", "William Blore", "Dr. Armstrong"],
      portada: ""
    },
    {
      titulo: "La muerte de Roger Ackroyd",
      autor: "Agatha Christie",
      sinopsis: "Hércules Poirot, retirado en un pueblo inglés, investiga el asesinato del acaudalado Roger Ackroyd, apuñalado poco después de conocer un secreto que podía arruinar a alguien cercano a él. La historia es narrada por el doctor Sheppard, vecino y confidente de Poirot.",
      personajes: ["Hércules Poirot", "Dr. James Sheppard", "Roger Ackroyd", "Flora Ackroyd"],
      portada: ""
    },
    {
      titulo: "La muerte visita al dentista",
      autor: "Agatha Christie",
      sinopsis: "Poco después de que Poirot visite a su dentista, este aparece muerto en su consultorio en circunstancias que apuntan a un asesinato disfrazado de suicidio. Poirot investiga entre los demás pacientes del día, cada uno con algo que ocultar.",
      personajes: ["Hércules Poirot", "Henry Morley", "Inspector Japp"],
      portada: ""
    },
    {
      titulo: "Asesinato en el Orient Express",
      autor: "Agatha Christie",
      sinopsis: "Un tren de lujo queda varado en la nieve con un pasajero asesinado a bordo. Poirot, que viaja en el mismo vagón, debe resolver el crimen entre un grupo cerrado de sospechosos antes de que el tren pueda continuar su viaje.",
      personajes: ["Hércules Poirot", "Samuel Ratchett", "Bianchi"],
      portada: ""
    },
    {
      titulo: "Muerte en el Nilo",
      autor: "Agatha Christie",
      sinopsis: "Durante un crucero por el Nilo, la joven y adinerada Linnet Doyle es hallada asesinada. Poirot, también a bordo, investiga un crimen marcado por los celos y un triángulo amoroso entre los pasajeros.",
      personajes: ["Hércules Poirot", "Linnet Doyle", "Simon Doyle", "Jacqueline de Bellefort"],
      portada: ""
    },
    {
      titulo: "El color que cayó del cielo",
      autor: "H. P. Lovecraft",
      sinopsis: "Un meteorito se estrella en la granja de la familia Gardner, cerca de Arkham, trayendo consigo un color imposible que contamina la tierra, el agua y a los seres vivos del lugar, sumiéndolos en una lenta y espantosa decadencia.",
      personajes: ["Nahum Gardner", "Ammi Pierce", "El narrador (topógrafo)"],
      portada: ""
    },
    {
      titulo: "La llamada de Cthulhu",
      autor: "H. P. Lovecraft",
      sinopsis: "El narrador reconstruye, a partir de los papeles de su tío abuelo, la existencia de un culto que venera a Cthulhu, una entidad ancestral dormida en la ciudad sumergida de R'lyeh, y el relato de un marinero que se topó con ella.",
      personajes: ["Francis Wayland Thurston", "Gustaf Johansen", "Inspector Legrasse"],
      portada: ""
    },
    {
      titulo: "El horror de Dunwich",
      autor: "H. P. Lovecraft",
      sinopsis: "En el decadente pueblo de Dunwich, Wilbur Whateley crece en circunstancias extrañas y aceleradas, parte de un plan familiar para traer al mundo a entidades de otra dimensión, hijas de Yog-Sothoth.",
      personajes: ["Wilbur Whateley", "Lavinia Whateley", "Viejo Whateley", "Dr. Henry Armitage"],
      portada: ""
    },
    {
      titulo: "La música de Erich Zann",
      autor: "H. P. Lovecraft",
      sinopsis: "Un estudiante alquila una habitación en un edificio extraño, donde escucha a su vecino anciano y mudo, el violista Erich Zann, tocar una música inquietante por las noches para mantener algo a raya más allá de su ventana.",
      personajes: ["El narrador (estudiante)", "Erich Zann"],
      portada: ""
    },
    {
      titulo: "El festival",
      autor: "H. P. Lovecraft",
      sinopsis: "Un hombre viaja a Kingsport para participar de una reunión ancestral en la noche de Yule, junto a parientes que nunca conoció, y termina siendo parte de un ritual siniestro en catacumbas subterráneas.",
      personajes: ["El narrador (sin nombre)"],
      portada: ""
    }
  ];

  const shelf = document.getElementById("shelf");

  const porAutor = new Map();
  libros.forEach((libro) => {
    if (!porAutor.has(libro.autor)) porAutor.set(libro.autor, []);
    porAutor.get(libro.autor).push(libro);
  });

  const autoresOrdenados = [...porAutor.keys()].sort((a, b) => a.localeCompare(b, "es"));

  autoresOrdenados.forEach((autor) => {
    const obras = porAutor.get(autor);

    const group = document.createElement("div");
    group.className = "author-group";

    const head = document.createElement("div");
    head.className = "author-head";
    head.innerHTML = `
      <span class="author-name">${autor}</span>
      <span class="author-count">${obras.length} ${obras.length === 1 ? "libro" : "libros"}</span>
    `;
    group.appendChild(head);

    const books = document.createElement("div");
    books.className = "books";

    obras.forEach((libro) => {
      const row = document.createElement("div");
      row.className = "book";

      const cover = document.createElement("div");
      cover.className = "cover";
      if (libro.portada) {
        const img = document.createElement("img");
        img.src = libro.portada;
        img.alt = `Portada de ${libro.titulo}`;
        cover.appendChild(img);
      } else {
        const placeholder = document.createElement("span");
        placeholder.className = "placeholder";
        placeholder.textContent = "—";
        cover.appendChild(placeholder);
      }

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `
        <span class="title">${libro.titulo}</span>
        <p class="synopsis">${libro.sinopsis}</p>
        <p class="characters"><span class="label">Personajes</span>${libro.personajes.join(", ")}</p>
      `;

      row.appendChild(cover);
      row.appendChild(info);
      books.appendChild(row);
    });

    group.appendChild(books);
    shelf.appendChild(group);
  });
</script>
